<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python 3.12.4</title>
<style>
:root{--bg:#0c0c0c;--text:#cccccc;--dim:#767676}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font:14px/1.5 Consolas,"Cascadia Mono",Menlo,monospace;overflow:auto}
#t{padding:14px 16px;white-space:pre-wrap;word-break:break-word;min-height:100%;box-sizing:border-box;cursor:text}
.dim{color:var(--dim)}
.opt{cursor:pointer;display:block;width:fit-content}
.opt:hover{text-decoration:underline}
.lite{color:#90ee90}.proxy{color:#ffb6c1}.disc{color:#a970ff}.info{color:#ffd60a}.exit{color:#ff4d4d}
.line{display:flex}
#in{flex:1;background:none;border:0;outline:none;color:var(--text);font:inherit;padding:0;margin-left:.5ch;caret-color:var(--text)}
</style>
</head>
<body>
<div id="t">
  <div id="out"></div>
  <div class="line" id="pr" style="display:none"><span>&gt;&gt;&gt;</span><input id="in" autocomplete="off" spellcheck="false" aria-label="Choice"></div>
</div>
<script>
const SRC = {
  lite:  'https://raw.githubusercontent.com/xengineOfficial/guava/refs/heads/main/autoupd.html',
  proxy: 'https://raw.githubusercontent.com/xengineOfficial/guava/refs/heads/main/autoupd2.html'
};
const DISCORD = 'https://discord.gg/KPYQysD2km';

const out = document.getElementById('out');
const pr = document.getElementById('pr');
const inp = document.getElementById('in');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function print(html, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.innerHTML = html;
  out.appendChild(d);
  scrollTo(0, document.body.scrollHeight);
  return d;
}
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------- loader logic ---------- */
async function sha256(text) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 0;
    for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0;
    return 'x' + h + ':' + text.length;
  }
}
const ck = k => 'boot_cache_' + k;
const getCache = k => { try { return JSON.parse(localStorage.getItem(ck(k))); } catch (e) { return null; } };
const setCache = (k, v) => { try { localStorage.setItem(ck(k), JSON.stringify(v)); } catch (e) {} };

function runInNewTab(code) {
  const w = window.open('about:blank', '_blank');
  if (!w) return false;
  w.document.open(); w.document.write(code); w.document.close();
  return true;
}

let pending = null; // code waiting for a click if pop-up blocked
function offer(code, label) {
  pending = code;
  const d = print('[ ' + label + ' ] (click or press Enter)', 'opt');
  d.onclick = () => {
    if (!runInNewTab(code)) print('Pop-up blocked. Allow pop-ups for this page and try again.', 'exit');
  };
}

async function launch(key, name, cls) {
  busy(true);
  print('Fetching ' + name + '...', cls);
  let code;
  const cached = getCache(key);
  try {
    const r = await fetch(SRC[key], { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    code = await r.text();
  } catch (e) {
    print('Error: ' + esc(e.message), 'exit');
    if (cached) offer(cached.code, 'Open last saved version');
    busy(false);
    return;
  }
  const hash = await sha256(code);
  if (cached && cached.hash === hash) {
    print('Up to date. No changes found.', 'dim');
    offer(cached.code, 'Open ' + name + ' anyway');
  } else {
    setCache(key, { hash, code });
    print(cached ? 'New version found. Launching...' : 'First run. Launching...', cls);
    if (runInNewTab(code)) print('Opened in a new tab.', 'dim');
    else { print('Browser blocked the pop-up.', 'exit'); offer(code, 'Open ' + name); }
  }
  busy(false);
  menuHint();
}

/* ---------- menu ---------- */
const OPTS = [
  ['1', 'Guava Lite', 'lite'],
  ['2', 'GuavaProxy', 'proxy'],
  ['3', 'Discord', 'disc'],
  ['4', 'Info', 'info'],
  ['5', 'Exit', 'exit']
];

function menu() {
  print('');
  OPTS.forEach(([n, label, cls]) => {
    const d = print('[' + n + '] - ' + label, 'opt ' + cls);
    d.onclick = () => choose(n);
  });
  print('');
  print('Select an option (type a number and press Enter):', 'dim');
}
function menuHint() { print('Type a number to continue [1-5].', 'dim'); }

function choose(n) {
  if (inp.disabled) return;
  print('&gt;&gt;&gt; ' + esc(n));
  switch (n) {
    case '1': launch('lite', 'Guava Lite', 'lite'); break;
    case '2': launch('proxy', 'GuavaProxy', 'proxy'); break;
    case '3':
      print('Opening Discord...', 'disc');
      if (!window.open(DISCORD, '_blank', 'noopener')) print('Pop-up blocked. Visit ' + DISCORD, 'disc');
      menuHint();
      break;
    case '4':
      print('');
      print('Guava is a collection of games, services, and applications that are easily accessible on the web.', 'info');
      print('Guava Lite is the lightweight version. GuavaProxy is the full version with tabs, shortcuts, and proxy options.', 'info');
      print('');
      menuHint();
      break;
    case '5':
      print('Exiting...', 'exit');
      inp.disabled = true;
      setTimeout(() => {
        window.close();
        // Browsers only allow close() on script-opened tabs; fall back to a blank page.
        setTimeout(() => { location.replace('about:blank'); }, 200);
      }, 300);
      break;
    default:
      print('Invalid option: ' + esc(n), 'exit');
      menuHint();
  }
}

function busy(b) { inp.disabled = b; if (!b) inp.focus(); }

inp.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = inp.value.trim();
  inp.value = '';
  if (!v && pending) { if (!runInNewTab(pending)) print('Pop-up blocked.', 'exit'); return; }
  if (v) choose(v);
});
document.getElementById('t').addEventListener('click', () => { if (!inp.disabled) inp.focus(); });

/* ---------- fake python boot ---------- */
(async () => {
  const lines = [
    'Python 3.12.4 (tags/v3.12.4:8e8a4ba, Jun  6 2024, 19:30:16) [MSC v.1940 64 bit (AMD64)] on win32',
    'Type "help", "copyright", "credits" or "license" for more information.'
  ];
  for (const l of lines) { print(esc(l), 'dim'); await sleep(250); }
  print('&gt;&gt;&gt; import guava', '');
  await sleep(500);
  print('Loading modules...', 'dim');
  await sleep(450);
  print('Bootstrapper ready.', 'dim');
  menu();
  pr.style.display = 'flex';
  inp.focus();
})();
</script>
</body>
</html>
